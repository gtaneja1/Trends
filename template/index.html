<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales + Marketing Forecast Dashboard</title>
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js CDN for trend visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Link to external Vanilla CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 
            HEADER SECTION:
            Displays application name, subtitle, and API status indicator.
        -->
        <header class="app-header">
            <!-- Header title, logo, and active API status light will go here -->
        </header>

        <!-- 
            MAIN DASHBOARD GRID:
            Splits layout into Input Form, Real-Time Trend Charts, and Forecast Output.
        -->
        <main class="dashboard-grid">
            
            <!-- 
                1. INPUT SECTION (Left Panel)
                Where user inputs business profile, target audience, issues, and goals.
            -->
            <section class="panel input-panel">
                <!-- 
                    A form containing:
                    - Brand/Individual Name (Input)
                    - Entity Type (Select: Product, Service, Influencer, Creator)
                    - Target Platforms (Checkboxes: Instagram, TikTok, YouTube, LinkedIn, Web)
                    - Target Audience Details (Textarea)
                    - Current Challenges/Issues (Textarea)
                    - Business Goals (Textarea)
                -->
            </section>

            <!-- 
                2. TRENDS & INDICATORS SECTION (Middle Panel)
                Displays market interest charts and economic index values.
            -->
            <section class="panel trends-panel">
                <!-- 
                    Displays dynamic cards and Chart.js canvases:
                    - Economic Indicators (Inflation Rate, Consumer Sentiment, Interest Rates)
                    - Platform Trends (Chart showing search query/hashtag trends over time)
                    - Trending keyword chips
                -->
            </section>

            <!-- 
                3. FORECAST & MARKETING OUTPUT SECTION (Right Panel)
                Displays results of analysis: Next Steps & Marketing Ideas.
            -->
            <section class="panel results-panel">
                
                <!-- 
                    PIPELINE PROGRESS LOADER (Shown during processing):
                    Displays step-by-step loading state corresponding to project requirements:
                    - Step 1: Parsing input details
                    - Step 2: Evaluating economic indicators
                    - Step 3: Analyzing platform trends
                    - Step 4: Formulating sales next-steps
                    - Step 5: Generating marketing execution ideas
                -->
                
                <!-- 
                    OUTPUT DISPLAY:
                    - Next Steps: Recommendations cards with impact and difficulty ratings.
                    - Marketing Ideas: Tabs containing copywriting hooks, content calendar, and platform-specific execution checklist.
                -->
                
            </section>
        </main>
    </div>

    <!-- Link to external Javascript logic -->
    <script src="app.js"></script>
</body>
</html>
